<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyaya-Sahayak - AI Legal First Responder</title>

    <!-- CDN Links -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyADvsIXfgfoeQTtVO7J5xwcHbjUi7b31xc",
            authDomain: "nyaya-sahayak-core.firebaseapp.com",
            projectId: "nyaya-sahayak-core",
            storageBucket: "nyaya-sahayak-core.firebasestorage.app",
            messagingSenderId: "953796636203",
            appId: "1:953796636203:web:7d02f504569b7c395ec46e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // Check if already logged in
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User is signed in, redirect to console
                window.location.href = '/console.html';
            }
        });

        // Expose login function globally
        window.handleLogin = async function () {
            try {
                const result = await signInWithPopup(auth, provider);
                window.location.href = '/console.html';
            } catch (error) {
                console.error("Login error:", error);
                alert("Login failed: " + error.message);
            }
        };
    </script>
</head>

<body>
    <!-- Grid Background -->
    <div class="grid-background"></div>

    <!-- ========================================
         LAUNCH GATEWAY OVERLAY (Constitution Theme)
    ======================================== -->
    <div id="launch-gateway" class="launch-gateway" style="display: flex;">
        <!-- Background Pattern -->
        <div class="gateway-bg-pattern"></div>

        <!-- Ashoka Chakra Watermark -->
        <div class="ashoka-chakra"></div>

        <!-- Main Content -->
        <div class="gateway-content">
            <!-- Shield/Security Icon -->
            <div class="security-badge">
                <i class="fas fa-shield-alt"></i>
                <span>Secure & Confidential</span>
            </div>

            <!-- Hero Section -->
            <div class="gateway-hero">
                <h1 class="gateway-headline">
                    <span class="brand-name">NYAYA-SAHAYAK</span><br>
                    <span class="highlight-text">THE LEGAL FIRST-RESPONDER</span>
                </h1>
                <p class="gateway-subheadline">
                    Network Yielding AI for Justice & Awareness Sahayak<br>
                    <span class="team-credit">Smart Education | University of Delhi</span>
                </p>

                <!-- CTA Button - Now triggers login -->
                <button class="gateway-cta" id="gateway-enter-btn" onclick="handleLogin()">
                    <i class="fas fa-lock-open mr-3"></i>
                    Sign In with Google
                    <i class="fas fa-arrow-right ml-3"></i>
                </button>
            </div>

            <!-- Quick Links -->
            <div class="gateway-quick-links">
                <a href="#" class="gateway-link">
                    <i class="fas fa-graduation-cap"></i>
                    <span>About the Project</span>
                </a>
                <a href="#" class="gateway-link">
                    <i class="fas fa-book"></i>
                    <span>Know Your Rights</span>
                </a>
                <a href="#" class="gateway-link">
                    <i class="fas fa-gavel"></i>
                    <span>Our Objectives</span>
                </a>
                <a href="#" class="gateway-link">
                    <i class="fas fa-user-shield"></i>
                    <span>Privacy Promise</span>
                </a>
            </div>

            <!-- Footer Trust Badge -->
            <div class="gateway-footer">
                <div class="trust-badges">
                    <span class="badge-item">
                        <i class="fas fa-balance-scale"></i>
                        Constitutional Integrity
                    </span>
                    <span class="badge-item">
                        <i class="fas fa-lock"></i>
                        End-to-End Encrypted
                    </span>
                    <span class="badge-item">
                        <i class="fas fa-indian-rupee-sign"></i>
                        Made in India
                    </span>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
